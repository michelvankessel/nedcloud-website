

services:
  postgres:
    image: postgres:16-alpine
    container_name: nedcloud-dev-db
    env_file:
      - .env.local
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nedcloud} -d ${DB_NAME:-nedcloud}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${DB_USER:-nedcloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nedcloud_dev}
      POSTGRES_DB: ${DB_NAME:-nedcloud}

  migrate:
    image: node:20-alpine
    container_name: nedcloud-dev-migrate
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${DB_USER:-nedcloud}:${DB_PASSWORD:-nedcloud_dev}@postgres:5432/${DB_NAME:-nedcloud}
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma migrate deploy && npx prisma db seed"
    profiles:
      - migrate

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: nedcloud-dev-app
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.local
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nedcloud}:${DB_PASSWORD:-nedcloud_dev}@postgres:5432/${DB_NAME:-nedcloud}
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "rm -rf /app/.next && npx next dev --webpack"

  studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: nedcloud-dev-studio
    ports:
      - "${STUDIO_PORT:-5555}:5555"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nedcloud}:${DB_PASSWORD:-nedcloud_dev}@postgres:5432/${DB_NAME:-nedcloud}
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma studio --hostname 0.0.0.0 --port ${STUDIO_PORT:-5555}
    profiles:
      - studio

volumes:
  postgres_dev_data: